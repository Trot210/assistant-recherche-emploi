name: Synchronisation des offres

on:
  schedule:
    # Toutes les 20 minutes. GitHub peut retarder l'exécution en cas de
    # forte charge sur le plan gratuit — pas de garantie de précision.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher /api/offres/sync
        run: |
          curl -sS -X POST "${{ secrets.SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body

      # Pas de notation automatique ici : chaque appel de scoring facture
      # l'API Claude, et cette synchro tourne toutes les 20 min — noter en
      # masse à ce rythme épuise vite le solde. Le scoring se fait
      # uniquement à la demande (bouton "Noter cette offre" sur une offre
      # précise), pour rester à coût nul en dehors d'un usage volontaire.
