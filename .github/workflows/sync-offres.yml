name: Synchronisation des offres

on:
  schedule:
    # Toutes les 20 minutes. GitHub peut retarder l'exécution en cas de
    # forte charge sur le plan gratuit — pas de garantie de précision.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher /api/offres/sync
        run: |
          curl -sS -X POST "${{ secrets.SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body

      - name: Noter les offres en attente (par lots, jusqu'à rattraper le backlog)
        run: |
          SCORING_URL="${SYNC_URL%/api/offres/sync}/api/scoring/batch"
          for i in $(seq 1 15); do
            REPONSE=$(curl -sS -X POST "$SCORING_URL" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Lot $i: $REPONSE"
            RESTANTES=$(echo "$REPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('restantes', 0))" 2>/dev/null || echo 0)
            if [ "$RESTANTES" -le 0 ]; then
              echo "Toutes les offres sont notées."
              break
            fi
          done
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
